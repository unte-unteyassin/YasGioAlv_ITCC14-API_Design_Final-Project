openapi: 3.0.3
info:
  title: XU EcoLab API
  version: 1.0.0
  description: >
    REST API for XU EcoLab, a web app where XU COMPSTUD students, instructors
    and staff report energy waste in the computer labs, and lab technicians
    (admins) verify and resolve each report. All responses are JSON.
    Report photos are uploaded to Cloudinary by the frontend, and only the
    resulting image URL is sent to this API.
  contact:
    name: "[Group name]"
servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://xu-ecolab.example.com/api
    description: Deployed server (placeholder)
tags:
  - name: Auth
    description: Registration and login
  - name: Users
    description: Account information
  - name: Reports
    description: Energy waste reports (main resource, full CRUD)
  - name: Status Updates
    description: Admin verification and resolution history of a report
  - name: Rooms
    description: Computer labs and rooms that reports refer to
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      description: Creates an account with the role "user". Admin accounts are created by an existing admin or seeded in the database.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Juan Dela Cruz
              email: juan@xu.edu.ph
              password: secret123
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive an access token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: juan@xu.edu.ph
              password: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/me:
    get:
      tags: [Users]
      summary: Get the logged-in user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports:
    get:
      tags: [Reports]
      summary: List reports
      description: Returns reports from all users, newest first. Supports filtering and paging.
      operationId: listReports
      parameters:
        - name: status
          in: query
          description: Only return reports with this status
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: wasteType
          in: query
          description: Only return reports of this waste type
          schema:
            $ref: '#/components/schemas/WasteType'
        - name: roomId
          in: query
          description: Only return reports for this room
          schema:
            type: integer
            example: 3
        - name: mine
          in: query
          description: If true, only return reports made by the logged-in user
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          description: Page number, starting at 1
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of reports per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Reports]
      summary: Submit a new energy waste report
      description: The report starts with the status "pending" and belongs to the logged-in user.
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
            example:
              roomId: 3
              wasteType: air_conditioner
              description: AC still running at full cold, room empty since lunch.
              photoUrl: https://res.cloudinary.com/demo/image/upload/lab3-ac.jpg
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Reports]
      summary: Get one report
      operationId: getReport
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reports]
      summary: Edit a report
      description: A user can edit only their own report while its status is "pending". An admin can edit any report.
      operationId: updateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
            example:
              roomId: 3
              wasteType: lights_fans
              description: Lights and ceiling fans left on after the 4 PM class.
              photoUrl: null
      responses:
        '200':
          description: Report updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Reports]
      summary: Delete a report
      description: A user can delete only their own report while its status is "pending". An admin can delete any report.
      operationId: deleteReport
      responses:
        '204':
          description: Report deleted, no content returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{reportId}/status:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    patch:
      tags: [Status Updates]
      summary: Verify or resolve a report (admin only)
      description: Changes the report status and records the change, with an optional note, in its status history.
      operationId: updateReportStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
            example:
              status: resolved
              note: Technician turned off the AC and set the timer.
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{reportId}/status-updates:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Status Updates]
      summary: Get the status history of a report
      operationId: listStatusUpdates
      responses:
        '200':
          description: Status changes, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      operationId: listRooms
      parameters:
        - name: building
          in: query
          description: Only return rooms in this building
          schema:
            type: string
            example: ICT Building
      responses:
        '200':
          description: All rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      summary: Add a room (admin only)
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              name: Computer Lab 3
              building: ICT Building
              floor: 2
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Get one room
      operationId: getRoom
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rooms]
      summary: Edit a room (admin only)
      operationId: updateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
            example:
              name: Computer Lab 3
              building: ICT Building
              floor: 3
      responses:
        '200':
          description: Room updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Rooms]
      summary: Delete a room (admin only)
      description: A room that still has reports cannot be deleted.
      operationId: deleteRoom
      responses:
        '204':
          description: Room deleted, no content returned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token returned by POST /auth/login
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      description: ID of the report
      schema:
        type: integer
        example: 12
    RoomId:
      name: roomId
      in: path
      required: true
      description: ID of the room
      schema:
        type: integer
        example: 3
  responses:
    BadRequest:
      description: The request body or a parameter is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation failed
            details: wasteType must be one of pc_monitor, air_conditioner, lights_fans, other_electronics, other
    Unauthorized:
      description: Missing, invalid or expired token, or wrong login details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required
    Forbidden:
      description: The logged-in user is not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: You can only change your own pending reports
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Report not found
    Conflict:
      description: The request conflicts with existing data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Email is already registered
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Short error message
          example: Report not found
        details:
          type: string
          description: Extra information about what went wrong
    UserRole:
      type: string
      description: Students, instructors and staff are all "user". Lab technicians are "admin".
      enum: [user, admin]
    WasteType:
      type: string
      enum: [pc_monitor, air_conditioner, lights_fans, other_electronics, other]
      example: air_conditioner
    ReportStatus:
      type: string
      enum: [pending, verified, resolved]
      example: pending
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Juan Dela Cruz
        email:
          type: string
          format: email
          example: juan@xu.edu.ph
        password:
          type: string
          format: password
          minLength: 8
          example: secret123
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: juan@xu.edu.ph
        password:
          type: string
          format: password
          example: secret123
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT to send as a Bearer token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Dela Cruz
        email:
          type: string
          format: email
          example: juan@xu.edu.ph
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-03T08:30:00Z'
    RoomInput:
      type: object
      required: [name, building]
      properties:
        name:
          type: string
          example: Computer Lab 3
        building:
          type: string
          example: ICT Building
        floor:
          type: integer
          example: 2
    Room:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              example: 3
        - $ref: '#/components/schemas/RoomInput'
    ReportInput:
      type: object
      required: [roomId, wasteType, description]
      properties:
        roomId:
          type: integer
          example: 3
        wasteType:
          $ref: '#/components/schemas/WasteType'
        description:
          type: string
          maxLength: 500
          example: AC still running at full cold, room empty since lunch.
        photoUrl:
          type: string
          format: uri
          nullable: true
          description: Optional Cloudinary URL of the uploaded photo
          example: https://res.cloudinary.com/demo/image/upload/lab3-ac.jpg
    Report:
      allOf:
        - type: object
          required: [id, userId, status, createdAt, updatedAt]
          properties:
            id:
              type: integer
              example: 12
            userId:
              type: integer
              description: ID of the user who made the report
              example: 1
            status:
              $ref: '#/components/schemas/ReportStatus'
            createdAt:
              type: string
              format: date-time
              example: '2026-11-03T08:30:00Z'
            updatedAt:
              type: string
              format: date-time
              example: '2026-11-03T09:10:00Z'
        - $ref: '#/components/schemas/ReportInput'
    ReportList:
      type: object
      required: [data, page, limit, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          description: Total number of reports matching the filters
          example: 42
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ReportStatus'
        note:
          type: string
          maxLength: 300
          example: Technician turned off the AC and set the timer.
    StatusUpdate:
      type: object
      required: [id, reportId, adminId, oldStatus, newStatus, createdAt]
      properties:
        id:
          type: integer
          example: 5
        reportId:
          type: integer
          example: 12
        adminId:
          type: integer
          description: ID of the admin who made the change
          example: 2
        oldStatus:
          $ref: '#/components/schemas/ReportStatus'
        newStatus:
          $ref: '#/components/schemas/ReportStatus'
        note:
          type: string
          example: Technician turned off the AC and set the timer.
        createdAt:
          type: string
          format: date-time
          example: '2026-11-03T09:10:00Z'
